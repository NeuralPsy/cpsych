[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpsych"
version = "1.0.0"
description = "Modular computational psychiatry platform: SDE-based modules of mental functions with parameter modulation couplings"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kirill Vasilchenko"}]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]
sandbox = ["ipywidgets>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (T>86400)"]
