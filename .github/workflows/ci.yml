name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[test]"

      - name: Verify numbers
        run: python article/verify_numbers.py

      - name: Run tests
        run: pytest -m "not slow" --tb=short -q
